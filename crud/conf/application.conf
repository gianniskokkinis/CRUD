# This is the main configuration file for the application.
# https://www.playframework.com/documentation/latest/ConfigFile


db.default.driver = com.mysql.cj.jdbc.Driver
db.default.url = "jdbc:mysql://localhost:3306/store"
db.default.username = "synergic"
db.default.password = "synergic"


# Connection pool settings
db.default.hikaricp.minimumIdle = 5
db.default.hikaricp.maximumPoolSize = 20
db.default.hikaricp.connectionTimeout = 30000
db.default.hikaricp.idleTimeout = 600000
db.default.hikaricp.maxLifetime = 1800000

# Enable database evolutions for test environment
play.evolutions.db.default.enabled = true
play.evolutions.db.default.autoApply = true

# Akka configuration for testing
akka {
  actor {
    default-dispatcher {
      fork-join-executor {
        parallelism-min = 1
        parallelism-max = 4
      }
    }
  }
}

# Play modules
play.modules.enabled += "play.api.libs.ws.ahc.AhcWSModule"